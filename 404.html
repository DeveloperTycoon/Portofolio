  <body>
    <link rel="stylesheet" href="./style.css" />
    <div>
      <link href="./404.css" rel="stylesheet" />

      <div class="not-found-container1">
        <h3>OOPS! PAGE NOT FOUND</h3>
        <div class="not-found-container2">
          <h1 class="not-found-text2">404</h1>
        </div>
        <div class="not-found-container3">
          <h2 class="not-found-text3">
            WE ARE SORRY, BUT THE PAGE YOU REQUESTED WAS NOT FOUND
          </h2>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var PROBE_ATTR = 'data-teleport-slider-probe';
        var PROBE_MAX_LIFETIME_MS = 30000;
        var SwiperCtor = null;
        var capturedModules = null;
        var probeEl = null;
        var trackedInstances = [];
        function safeJsonParse(raw) {
          if (!raw) return null;
          var decoder = document.createElement('textarea');
          decoder.innerHTML = raw;
          try { return JSON.parse(decoder.value); } catch (e) { return null; }
        }
        function toPositiveInt(v, fallback) {
          var n = parseInt(v, 10);
          return (!isNaN(n) && n > 0) ? n : fallback;
        }
        function toSpacing(v, fallback) {
          // Zero is a legitimate gap, so it must not fall through to the default
          // the way toPositiveInt makes it.
          var n = parseInt(v, 10);
          return (!isNaN(n) && n >= 0) ? n : fallback;
        }
        function buildBreakpoints(el) {
          var raw = safeJsonParse(el.getAttribute('data-breakpoints')) || {};
          var mobile = raw.mobile || {};
          var tablet = raw.tablet || {};
          var desktop = raw.desktop || {};
          // With no breakpoint map, derive the per-width slide count from the
          // slider's OWN base config instead of assuming a multi-card carousel.
          // Hardcoding 3-on-desktop here overrode every single-slide slider that
          // omits the map — the generator tells the model to omit it for hero
          // carousels, and the gallery lightbox omitted it too — which fits every
          // slide onto one page and leaves the arrows and bullets with nowhere to
          // go. Same derivation the editor uses in flows/slider.ts.
          var baseSlidesPerView = toPositiveInt(el.getAttribute('data-slides-per-view'), 1);
          var bps = {};
          bps[0] = {
            slidesPerView: toPositiveInt(mobile.slidesPerView, 1),
            spaceBetween: toSpacing(mobile.spaceBetween, 12),
          };
          bps[768] = {
            slidesPerView: toPositiveInt(tablet.slidesPerView, Math.min(baseSlidesPerView, 2)),
            spaceBetween: toSpacing(tablet.spaceBetween, 16),
          };
          bps[1024] = {
            slidesPerView: toPositiveInt(desktop.slidesPerView, baseSlidesPerView),
            spaceBetween: toSpacing(desktop.spaceBetween, 24),
          };
          return bps;
        }
        function buildConfig(el) {
          var cfg = {
            slidesPerView: toPositiveInt(el.getAttribute('data-slides-per-view'), 1),
            spaceBetween: toPositiveInt(el.getAttribute('data-space-between'), 0),
            breakpoints: buildBreakpoints(el),
          };
          // Carry over the module classes that the CDN bundle loaded
          // initially (Navigation / Pagination / Autoplay). Without these
          // the re-instantiated Swiper only has Resize + Observer — the
          // navigation arrows and pagination bullets become dead.
          if (capturedModules && capturedModules.length > 0) {
            cfg.modules = capturedModules.slice();
          }
          if (el.getAttribute('data-pagination') === 'true') {
            var paginationEl = el.querySelector('.swiper-pagination');
            if (paginationEl) cfg.pagination = { el: paginationEl, clickable: true, type: 'bullets' };
          }
          if (el.getAttribute('data-navigation') === 'true') {
            var nextEl = el.querySelector('.swiper-button-next');
            var prevEl = el.querySelector('.swiper-button-prev');
            if (nextEl && prevEl) cfg.navigation = { nextEl: nextEl, prevEl: prevEl };
          }
          return cfg;
        }
        function captureFromInstance(instance) {
          if (!instance) return;
          if (!SwiperCtor && instance.constructor && instance.constructor.name === 'Swiper') {
            SwiperCtor = instance.constructor;
          }
          if (!capturedModules && instance.params && Array.isArray(instance.params.modules)) {
            // Clone so Swiper's own mutation of params.modules during teardown
            // does not surprise us on a subsequent re-instantiation.
            capturedModules = instance.params.modules.slice();
          }
        }
        function createCtorProbe() {
          // This script is inline in <body>, so it runs while the document is
          // still parsing — before the deferred CDN bundle executes. The probe
          // is therefore guaranteed to be present for the bundle's one and only
          // init pass. It is appended at the end of <body>, after the Next.js
          // root, so it is also the LAST element that pass reaches: even if the
          // bundle ever choked on it, every real slider would already be built.
          var host = document.body || document.documentElement;
          if (!host) return;
          try {
            var el = document.createElement('div');
            el.setAttribute('data-thq', 'slider');
            el.setAttribute(PROBE_ATTR, 'true');
            el.setAttribute('aria-hidden', 'true');
            el.className = 'swiper';
            el.style.cssText =
              'position:absolute;left:-9999px;top:0;width:0;height:0;overflow:hidden;visibility:hidden;pointer-events:none';
            el.innerHTML =
              '<div data-thq="slider-wrapper" class="swiper-wrapper">' +
              '<div data-thq="slider-slide" class="swiper-slide"></div></div>';
            host.appendChild(el);
            probeEl = el;
            // Never leave the probe behind if the CDN bundle fails to load at all.
            setTimeout(disposeProbe, PROBE_MAX_LIFETIME_MS);
          } catch (_e) { /* best-effort */ }
        }
        function disposeProbe() {
          if (!probeEl) return;
          var el = probeEl;
          probeEl = null;
          try { if (el.swiper && !el.swiper.destroyed) el.swiper.destroy(true, false); } catch (_e) { /* best-effort */ }
          try { if (el.parentNode) el.parentNode.removeChild(el); } catch (_e) { /* best-effort */ }
        }
        function captureCtorFromProbe() {
          if (!probeEl) return;
          if (probeEl.swiper) {
            captureFromInstance(probeEl.swiper);
          }
          if (SwiperCtor) {
            disposeProbe();
          }
        }
        function trackInstance(instance) {
          instance.__teleportPatched = true;
          trackedInstances.push(instance);
          return instance;
        }
        function reapDetachedInstances() {
          // React unmounts a slider that lives inside a conditionally rendered
          // subtree — the product gallery lightbox — every time it closes. That
          // leaves our instance bound to a detached element with its window
          // resize handler and ResizeObserver still live, and every reopen adds
          // another one. Only DETACHED elements are reaped: destroy() nulls the
          // element's swiper reference, which would sabotage a live element whose
          // instance had since been replaced by someone else.
          if (trackedInstances.length === 0) return;
          var kept = [];
          for (var i = 0; i < trackedInstances.length; i++) {
            var instance = trackedInstances[i];
            var el = instance && instance.el;
            if (!el) continue;
            if (document.contains(el)) {
              kept.push(instance);
              continue;
            }
            try { if (!instance.destroyed) instance.destroy(true, false); } catch (_e) { /* best-effort */ }
          }
          trackedInstances = kept;
        }
        function collectSliders() {
          var all = document.querySelectorAll('[data-thq="slider"]');
          var sliders = [];
          for (var i = 0; i < all.length; i++) {
            if (all[i].hasAttribute(PROBE_ATTR)) continue;
            sliders.push(all[i]);
          }
          return sliders;
        }
        function rebuildPaginationDom(instance) {
          // Pagination bullets can be re-appended after our construction by
          // the CDN bundle's scheduled post-init render or by React
          // reconciliation during SPA back-nav. We re-query the pagination
          // container from the live instance (rather than a captured
          // reference) because React may have replaced the container DOM
          // node during a re-mount.
          try {
            if (instance.destroyed) return;
            var pagEl = instance.pagination && instance.pagination.el;
            if (pagEl) pagEl.innerHTML = '';
            if (instance.pagination && typeof instance.pagination.render === 'function') {
              instance.pagination.render();
            }
            if (instance.pagination && typeof instance.pagination.update === 'function') {
              instance.pagination.update();
            }
          } catch (_e) { /* best-effort */ }
        }
        function replaceWithFreshInstance(el) {
          // Destroy the CDN-constructed Swiper and rebuild it with the
          // proper config up front. Patching in place (setBreakpoint +
          // update) leaves pagination stuck at the original bullet count
          // (5 for 5 slides at the default slidesPerView=1), Swiper's
          // external pagination.render() APPENDS instead of rebuilding,
          // and there is no other public API to force a clean rebuild of
          // the pagination subsystem. A fresh construction with the right
          // breakpoints, pagination el, and navigation els gives us the
          // correct page count (ceil(slides / slidesPerView)) and the
          // first bullet correctly marked active.
          try {
            var pagEl = el.querySelector('.swiper-pagination');
            try { el.swiper.destroy(true, true); } catch (_destroyErr) { /* best-effort */ }
            // Clear any pagination bullets Swiper's destroy left behind so
            // our new render() does not append to them.
            if (pagEl) pagEl.innerHTML = '';
            if (!SwiperCtor) return false;
            var instance = trackInstance(new SwiperCtor(el, buildConfig(el)));
            // The CDN bundle schedules a delayed pagination render that
            // fires even after our destroy-and-recreate, re-appending
            // bullets into the container. React can also restore stale
            // bullet nodes from the prior page visit during SPA back-nav
            // reconciliation. Rebuild at several timings so any late
            // injection is mopped up.
            setTimeout(function () { rebuildPaginationDom(instance); }, 100);
            setTimeout(function () { rebuildPaginationDom(instance); }, 400);
            setTimeout(function () { rebuildPaginationDom(instance); }, 1000);
            return true;
          } catch (_err) {
            return false;
          }
        }
        var isWorking = false;
        function ensureSwiper(el) {
          if (!el) return false;
          if (el.swiper && el.swiper.__teleportPatched) return true;
          // Guard against reentry: constructing or modifying a Swiper mutates
          // the DOM, which re-fires the outer MutationObserver synchronously
          // and would otherwise loop back into this function against a
          // half-initialised instance.
          if (isWorking) return false;
          isWorking = true;
          try {
            if (el.swiper) {
              // Don't touch a Swiper that the CDN bundle is still constructing
              // — interfering before it finishes corrupts the layout. The
              // destroyed check covers the window between destroy and the
              // next mount.
              if (el.swiper.destroyed) return false;
              captureFromInstance(el.swiper);
              // Rebuild the instance from scratch with the correct config:
              // the CDN's default config ignores our breakpoints and the
              // pagination bullet count is locked to the original slide
              // count. A destroy + re-create is the only way to get the
              // right page-count pagination plus a correctly marked first
              // active bullet.
              return replaceWithFreshInstance(el);
            }
            // No .swiper attached — either the CDN bundle hasn't fired yet
            // (poll will retry), or the element was freshly re-mounted by
            // Next.js SPA back/forward nav, or a modal just revealed a slider
            // the bundle never saw. The bundle only inits on the initial
            // DOMContentLoaded (plus a URL change), so it won't re-init any of
            // those. Construct our own instance with the captured ctor + modules.
            if (!SwiperCtor) return false;
            try {
              // Clear any stale pagination/navigation DOM that survived the
              // re-mount so the fresh Swiper's render() doesn't append to
              // leftover bullets/arrows from the previous page visit.
              var stalePagination = el.querySelector('.swiper-pagination');
              if (stalePagination) stalePagination.innerHTML = '';
              trackInstance(new SwiperCtor(el, buildConfig(el)));
              return true;
            } catch (_err) {
              return false;
            }
          } finally {
            isWorking = false;
          }
        }
        function normalisePaginationCount() {
          // Defensive cleanup: any time the bootstrapper's trigger fires
          // (initial load, pageshow, or DOM mutation), reconcile the
          // pagination DOM with the Swiper instance's own bullet tracking.
          // The CDN bundle and React's SPA reconciliation can leak extra
          // bullet elements into the container; this keeps the visible
          // bullet count aligned with the post-breakpoint page count.
          var all = collectSliders();
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (!el.swiper || !el.swiper.__teleportPatched) continue;
            if (el.swiper.destroyed) continue;
            var pagEl = el.swiper.pagination && el.swiper.pagination.el;
            if (!pagEl) continue;
            var domCount = pagEl.querySelectorAll('.swiper-pagination-bullet').length;
            var tracked =
              el.swiper.pagination && el.swiper.pagination.bullets
                ? el.swiper.pagination.bullets.length
                : 0;
            if (domCount !== tracked && tracked > 0) {
              rebuildPaginationDom(el.swiper);
            }
          }
        }
        function ensureAll() {
          captureCtorFromProbe();
          reapDetachedInstances();
          var all = collectSliders();
          var allDone = all.length > 0;
          for (var i = 0; i < all.length; i++) {
            if (!ensureSwiper(all[i])) allDone = false;
          }
          normalisePaginationCount();
          return allDone;
        }
        var pollTimer = null;
        function startPolling() {
          if (pollTimer) return;
          var tries = 0;
          pollTimer = setInterval(function () {
            tries += 1;
            if (ensureAll() || tries >= 80) {
              clearInterval(pollTimer);
              pollTimer = null;
            }
          }, 100);
        }
        function trigger() {
          if (!ensureAll()) startPolling();
        }
        // Delay the first trigger until after the CDN bundle has finished
        // its own init pass. Running too early lets the MutationObserver
        // fire while the CDN's Swiper is half-constructed and our patch
        // interferes with layout.
        function scheduleInitialTrigger() {
          setTimeout(trigger, 200);
        }
        createCtorProbe();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', scheduleInitialTrigger);
        } else {
          scheduleInitialTrigger();
        }
        window.addEventListener('pageshow', trigger);
        // Observe the whole document so Next.js SPA back-nav (which re-mounts
        // the slider element without an attached .swiper instance) triggers
        // re-instantiation via the captured ctor. Don't invoke the patch
        // synchronously on each mutation — the CDN bundle's own Swiper
        // construction fires many mutations and we'd otherwise patch a
        // half-initialised instance. Debounce through a macrotask so the
        // current sync mutation chain finishes first.
        var mutationPending = false;
        try {
          var observer = new MutationObserver(function () {
            if (mutationPending) return;
            mutationPending = true;
            setTimeout(function () { mutationPending = false; trigger(); }, 150);
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        } catch (_e) { /* MutationObserver unsupported — polling still covers initial load */ }
      })();
    </script>
